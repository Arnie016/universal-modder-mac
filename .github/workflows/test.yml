name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run --with pytest pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: playable remix acceptance checks
        run: |
          npm ci --ignore-scripts --prefix examples/tactics-possession
          ./bin/um remix inspect examples/tactics-possession
          ./bin/um remix test examples/tactics-possession --trust-code
      - run: ./bin/um --help && for g in scan fal sprite render3d video win mac backup publish kb remix; do ./bin/um $g --help > /dev/null; done
      - name: knowledge base
        run: ./bin/um kb check --index
      - name: nothing that shouldn't ship
        run: ./bin/um publish check .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: brew install ffmpeg
      - run: uv run --with pytest pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: playable remix acceptance checks
        run: |
          npm ci --ignore-scripts --prefix examples/tactics-possession
          ./bin/um remix inspect examples/tactics-possession
          ./bin/um remix test examples/tactics-possession --trust-code
      - name: compile the native helper (swiftc) and run the read-only commands
        run: |
          ./bin/um mac helper
          ./bin/um mac doctor --json
          ./bin/um mac ps || true
          ./bin/um mac sign-info /System/Applications/Chess.app
          ./bin/um scan --list
      - name: wheel ships the Swift source
        run: uv build && unzip -l dist/*.whl | grep um/swift/umhelper.swift
