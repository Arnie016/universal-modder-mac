// Headless check, run with  +exec test.cfg  (see verify.sh).
// ZDoom's `wait N` (in tics, 35/s) only delays the rest of the SAME command string, so the whole test is one
// alias - one command per line would fire everything at startup, before the level exists.
alias ma_run "wait 70; god; netevent ma_test; wait 40; screenshot; +attack; wait 150; -attack; wait 15; screenshot; wait 70; screenshot; echo MacArsenal: test done; wait 5; quit"
ma_run
