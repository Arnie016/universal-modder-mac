plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"macarcade" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client game tests: Fabric boots the real client, makes a world, runs our test, screenshots, and quits.
// `./gradlew runClientGameTest` - no Microsoft account needed (dev username), works on macOS.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "macarcade-test"
		enableGameTests = false
		eula = true
	}
}

// the test connects to `um mac stream` on this port (verify.sh passes -PmacarcadePort)
loom {
	runs {
		configureEach {
			if (name == "clientGameTest") vmArg "-Dmacarcade.port=${project.findProperty('macarcadePort') ?: 7777}"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
